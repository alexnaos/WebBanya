; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
data_dir = data

[env:d1_mini]
platform = espressif8266
board = d1
framework = arduino
board_build.filesystem = littlefs
upload_speed = 921600
monitor_speed = 115200
upload_resetmethod = nodemcu
build_flags = -Wl,--allow-multiple-definition
upload_port = COM5
lib_ldf_mode = deep+
lib_deps = 
	gyverlibs/GyverDB@^1.4.2
	GyverLibs/Settings @ ^1.0
	paulstoffregen/OneWire@^2.3.8
	milesburton/DallasTemperature@^4.0.6
	adafruit/Adafruit GFX Library@^1.12.4
	adafruit/Adafruit SSD1306@^2.5.16
	gyverlibs/GyverDS3231@^1.2.0
	bblanchon/ArduinoJson@^7.4.2
	gyverlibs/GyverBME280@^1.5.3
	knolleary/PubSubClient@^2.8

; === OTA ===
[env:d1_mini_ota]
platform = espressif8266
board = d1
framework = arduino
monitor_speed = 115200
build_flags = -Wl,--allow-multiple-definition
lib_ldf_mode = deep+
lib_deps =
	gyverlibs/GyverDB@^1.4.2
	GyverLibs/Settings @ ^1.0
	paulstoffregen/OneWire@^2.3.8
	milesburton/DallasTemperature@^4.0.6
	adafruit/Adafruit GFX Library@^1.12.4
	adafruit/Adafruit SSD1306@^2.5.16
	gyverlibs/GyverDS3231@^1.2.0
	bblanchon/ArduinoJson@^7.4.2
	gyverlibs/GyverBME280@^1.5.3
	knolleary/PubSubClient@^2.8
upload_protocol = espota
upload_port = 192.168.1.93
upload_flags =
    --auth=admin
; pio run -e d1_mini_ota --target upload -t uploadfs
